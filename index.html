<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Student</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- Tiêu đề -->
    <header class="app-header">
      <h1>Open Student</h1>
    </header>

    <!-- Thống kê -->
    <section class="stats" aria-label="Thống kê">
      <div class="stat">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Sinh viên</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-classes">0</span>
        <span class="stat-label">Lớp</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-gpa">0</span>
        <span class="stat-label">GPA trung bình</span>
      </div>
    </section>

    <!-- Danh sách sinh viên -->
    <section class="student-list">
      <h2>Danh sách sinh viên</h2>

      <div class="toolbar">
        <div class="search">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input type="search" id="search-input" placeholder="Tìm kiếm..." aria-label="Tìm kiếm sinh viên">
        </div>
        <button type="button" class="btn btn-primary" id="add-btn">+ Thêm sinh viên</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>MSSV</th>
              <th>Họ tên</th>
              <th>Lớp</th>
              <th>Điểm</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="student-body"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="main.js"></script>
</body>
</html>
